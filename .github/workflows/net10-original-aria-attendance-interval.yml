name: TWF 4.28 pure attendance interval golden (original x86)

on:
  push:
    branches: [arena/a4df3135-io]
    paths:
      - 'src/net10/tools/AriaOriginalAttendanceInterval/**'
      - 'src/net10/Aria/Core/Compatibility/OriginalAttendanceInterval.cs'
      - 'src/net10/Aria/Core/Aria.Core.csproj'
      - 'src/net10/Aria/Attendance.Tests/**'
      - 'src/net10/nuget.offline.config'
      - 'TWF 4.28/App/bin/T5V3.Attendance.dll'
      - '.github/workflows/net10-original-aria-attendance-interval.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-aria-attendance-interval:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute pinned TWF-packaged original pure TimeInterval without SQL
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (!(Test-Path $compiler)) { Write-Host '::error::Framework x86 compiler missing'; exit 2 }
          $probe = Join-Path $env:RUNNER_TEMP 'AriaOriginalInterval.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src/net10/tools/AriaOriginalAttendanceInterval/Program.cs'
          & $compiler /nologo /platform:x86 /target:exe "/out:$probe" $source
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::Original interval harness compilation failed'; exit 1 }
          $bin = Join-Path $env:GITHUB_WORKSPACE 'TWF 4.28/App/bin'
          $fixture = Join-Path $env:RUNNER_TEMP 'aria-original-attendance-interval.json'
          & $probe $bin $fixture
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $fixture)) { exit 1 }
          $data = Get-Content $fixture -Raw | ConvertFrom-Json
          if ($data.scope -ne 'SYNTHETIC_PURE_ORIGINAL_X86' -or
              @($data.cases.PSObject.Properties).Count -ne 8) {
            Write-Host '::error::Original interval fixture incomplete'; exit 1
          }
          $observed = @($data.cases.PSObject.Properties | ForEach-Object {
            '{0}={1}' -f $_.Name, ([string]$_.Value).ToLowerInvariant()
          }) -join ', '
          Write-Host "::notice::TWF 4.28 original SHA-pinned TimeInterval bounded observations: $observed. No SQL/attendance engine/day calculation/IIS/net10 parity."
      - name: Compare same-run original pure cases to net10 C# 7.3 adapter offline
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (!(Get-Command dotnet -ErrorAction SilentlyContinue) -or
              !(@(dotnet --list-sdks | Where-Object { $_ -match '^10\.0\.[0-9]+ ' }).Count -gt 0)) {
            Write-Host '::error::NEEDS-INFRA: preinstalled .NET 10 SDK unavailable, no online restore.'; exit 2
          }
          $tests = Join-Path $env:GITHUB_WORKSPACE 'src/net10/Aria/Attendance.Tests/Aria.Attendance.Tests.csproj'
          $config = Join-Path $env:GITHUB_WORKSPACE 'src/net10/nuget.offline.config'
          $fixture = Join-Path $env:RUNNER_TEMP 'aria-original-attendance-interval.json'
          if (!(Test-Path $fixture)) { Write-Host '::error::No same-run original fixture'; exit 1 }
          & dotnet restore $tests --configfile $config -v minimal
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::Offline attendance test restore failed'; exit 1 }
          & dotnet build $tests -c Release --no-restore -v minimal
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::Attendance adapter build failed'; exit 1 }
          $output = @(& dotnet run --project $tests -c Release --no-build --no-restore -- $fixture)
          $code = $LASTEXITCODE
          $output | Write-Host
          if ($code -ne 0 -or !($output | Select-String -Quiet 'Summary: 11 Passed, 0 Failed')) {
            Write-Host '::error::Bounded TWF 4.28 attendance interval golden mismatch; no leave/duty workflow parity.'; exit 1
          }
          Write-Host '::notice::Same-run SHA-pinned TWF original x86 8/8 pure intervals versus net10 C# 7.3 adapter 11/11 (3 port-only safety); NO request persistence, attendance engine, SQL Server 2016, original HTTP, IIS or 100-user load.'
