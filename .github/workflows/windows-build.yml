name: windows-build

# The rewrite targets .NET Framework 4.7.2 + IIS + SQL Server, and none of that exists
# on the Linux machine where the code is written. This workflow is that Windows machine:
# it compiles with MSBuild, runs the T5Web suite, and proves the database scripts
# against a real SQL Server engine (Express LocalDB, which the runner image already has).
# Another job asks a different question - does the core compile on .NET 8/10? - and answers
# it with a compiler instead of an opinion. A fifth job independently builds/tests TWF.
#
# It is deliberately push-triggered: a red run here is the same signal a red build on
# the customer's server would give, only earlier.
#
# Note on diagnostics: job logs live in Azure blob storage, which an offline review
# environment cannot read. Every step therefore re-prints a failing output as an
# `::error::` annotation, which is readable through the API (gh run view).

on:
  push:
    branches: ['**']
    paths:
      - 'src/T5Web/**'
      - 'src/TWF/**'
      - 'src/net10/**'
      - 'docs/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'src/T5Web/**'
      - 'src/TWF/**'
      - 'src/net10/**'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSBuild + tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # Every claim about "which version this was proven on" comes from here, printed by
      # the machine that ran it. The numbers in the docs are these numbers, not memory.
      - name: Show toolchain
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild -ErrorAction SilentlyContinue).Source
          $sqlcmd  = (Get-Command sqlcmd  -ErrorAction SilentlyContinue).Source
          Write-Host "OS       : $((Get-CimInstance Win32_OperatingSystem).Caption) $((Get-CimInstance Win32_OperatingSystem).Version)"
          Write-Host "MSBuild  : $msbuild"
          Write-Host "sqlcmd   : $sqlcmd"
          Write-Host "python   : $((Get-Command python -ErrorAction SilentlyContinue).Source)"
          if (-not $msbuild) { Write-Host '::error::MSBuild is not on PATH' ; exit 1 }
          msbuild -version

          # .NET Framework 4.x "release" key -> the version the compiler actually targets.
          $release = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full' -ErrorAction SilentlyContinue).Release
          $map = @{ 533320 = '4.8.1'; 528040 = '4.8'; 461808 = '4.7.2'; 460798 = '4.7'; 394802 = '4.6.2' }
          $framework = ($map.Keys | Where-Object { $release -ge $_ } | Sort-Object -Descending |
                        Select-Object -First 1)
          Write-Host ("NET FX   : release {0} = .NET Framework {1} (the projects target 4.7.2)" -f $release, $map[$framework])
          if ($release -lt 461808) { Write-Host '::error::.NET Framework 4.7.2 or newer is required and this runner has less' ; exit 1 }
          # A notice, not a log line: the job log is not reachable from outside the runner,
          # and "which version was this proven on" has to be readable by whoever asks.
          Write-Host ("::notice::VERSIONS build | OS {0} | .NET Framework {1} (release {2}) | target 4.7.2 | C# 7.3 | MSBuild {3}" -f `
                       (Get-CimInstance Win32_OperatingSystem).Version, $map[$framework], $release, `
                       ((msbuild -version -nologo | Select-Object -Last 1)))

      # The static gates run on Linux too; running them here proves they do not depend on
      # the developer machine. dnfile is needed by the engine-metadata gates.
      - name: Static gates
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet dnfile
          bash src/T5Web/build-and-test.sh --gates
          if ($LASTEXITCODE -ne 0) { throw "static gates failed with $LASTEXITCODE" }

      - name: Build (Release)
        shell: pwsh
        run: |
          $out = msbuild src/T5Web/T5Web.sln /p:Configuration=Release /m /v:minimal /nologo 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $errors = $out | Select-String -Pattern ': error ' | Select-Object -First 25
            foreach ($line in $errors) { Write-Host "::error::$line" }
            throw "MSBuild failed with $LASTEXITCODE"
          }

      - name: Run the suite
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter T5Web.Tests.exe | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::T5Web.Tests.exe was not produced'; exit 1 }
          Write-Host "running $($exe.FullName)"
          $out = & $exe.FullName 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            ($out | Select-String -Pattern 'FAIL|Failure|Expected|Unhandled' | Select-Object -First 20) |
              ForEach-Object { Write-Host "::error::$_" }
            throw "test suite failed with exit code $LASTEXITCODE"
          }

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t5web-release
          path: |
            src/T5Web/T5Web.Web/bin/Release
            src/T5Web/T5Web.Tests/bin/Release
          retention-days: 7
          if-no-files-found: warn

  iis-install:
    name: IIS + the published console
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # The site needs a database before it can be opened, not just a padlock. This
      # builds one on the LocalDB instance the runner image already has: the synthetic
      # engine schema (generated from the model, never hand-written), the portal's own
      # objects, the least-privilege role, the app pool's Windows login, and a fixture
      # account so a real Windows user can sign in and every feature is granted.
      # tools/ci-fixture-gate.py keeps the fixture in step with AdminFeature.
      - name: Prepare the database (schema, role, pool login, fixture)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Fail([string]$message) {
            Write-Host "::error::$message"
            exit 1
          }

          # LocalDB is owned by the account that creates it, and the app pool is a
          # different account, so the instance has to be *shared* to be reachable by
          # IIS at all. Share name, not instance name, is what the app connects to.
          $instance = 'T5Web'
          $shared = 'T5WebShared'
          sqllocaldb create $instance 2>&1 | Write-Host
          sqllocaldb stop $instance 2>&1 | Out-Null
          sqllocaldb share $instance $shared 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { Fail "could not share the LocalDB instance as $shared - the app pool cannot reach a private instance" }
          sqllocaldb start $instance 2>&1 | Write-Host
          if ($LASTEXITCODE -ne 0) { Fail "the LocalDB instance would not start" }

          $server = "(localdb)\.\$shared"
          "T5_SERVER=$server" | Out-File -FilePath $env:GITHUB_ENV -Append
          $probe = sqlcmd -S $server -E -b -h -1 -W -Q "SELECT @@VERSION" 2>&1
          $probe | Write-Host
          if ($LASTEXITCODE -ne 0) { Fail "the shared instance does not answer" }

          function Run-Script([string]$path, [string]$database, [string[]]$variables = @()) {
            Write-Host "--- $path"
            $args = @('-S', $server, '-E', '-b', '-i', $path, '-d', $database, '-f', '65001') + $variables
            $out = & sqlcmd $args 2>&1
            $code = $LASTEXITCODE
            $out | Write-Host
            if ($code -ne 0) {
              # One annotation carrying everything sqlcmd said. The job log is not
              # retrievable from outside, so this annotation is the whole diagnosis; the
              # previous version kept the last 12 lines, which were blank.
              $all = (($out | ForEach-Object { "$_" }) -join ' / ')
              if ($all.Length -gt 900) { $all = $all.Substring($all.Length - 900) }
              Fail "$path exited $code; sqlcmd said: $all"
            }
          }

          python src/T5Web/tools/synthetic-schema.py --sql > synthetic.sql
          if ($LASTEXITCODE -ne 0) { Fail 'synthetic-schema.py failed' }
          Run-Script 'synthetic.sql' 'master'
          Run-Script 'src/T5Web/db/01-t5web-objects.sql' 'ReportT5V3'
          Run-Script 'src/T5Web/db/02-t5web-sql-login.sql' 'ReportT5V3'
          # The app pool's Windows login is created after the site exists: IIS APPPOOL\X
          # is a virtual account that only resolves once the pool is there, and
          # CREATE LOGIN ... FROM WINDOWS answers "user or group not found" before that.
          # A Windows account the run can actually sign in as, plus a permission row for
          # every feature (tools/ci-fixture-gate.py holds this list to AdminFeature.cs).
          Run-Script 'src/T5Web/tools/ci-seed.sql' 'ReportT5V3' @('-v', "Who=$env:USERNAME")

          $check = sqlcmd -S $server -E -h -1 -W -Q "SET NOCOUNT ON; SELECT COUNT(*) FROM [Personnel].sys.database_principals WHERE name = N'1001'" 2>&1
          Write-Host "fixture check: $check"

      # This job installs the product the way the customer will: publish a folder,
      # enable the IIS roles, create the pool and the site, then ask IIS itself
      # whether an anonymous request is refused. It is the deployment kit executed,
      # not described.
      - name: Publish the console
        shell: powershell
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'T5WebAdmin'
          # A throw inside the script is the interesting message; without this the step
          # only says "exit code 1" and the reason stays in the unreadable job log.
          try {
            ./src/T5Web/deploy/0-publish.ps1 -OutputPath $out -Build
          } catch {
            Write-Host ("::error::0-publish.ps1: " + ($_.Exception.Message -replace "`r?`n", ' | '))
            exit 1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::0-publish.ps1 failed with $LASTEXITCODE"
            exit 1
          }
          "publish=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $out | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          # The views and the engine's dependencies are configuration-coupled: a missing
          # assembly here is a 500 on the first request, not a build error.
          Get-ChildItem (Join-Path $out 'bin') -Filter '*.dll' |
            Where-Object { $_.Name -match 'Mvc|EntityFramework|Personnel|WebPages|Razor' } |
            ForEach-Object { Write-Host ("  bin\" + $_.Name) }

      - name: Install IIS (deploy/1-install-iis.ps1)
        shell: powershell
        run: |
          try {
            ./src/T5Web/deploy/1-install-iis.ps1 -NoRebootPrompt
          } catch {
            Write-Host ("::error::1-install-iis.ps1: " + ($_.Exception.Message -replace "`r?`n", ' | '))
            exit 1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::1-install-iis.ps1 failed with $LASTEXITCODE"
            exit 1
          }
          # A feature that is enabled but whose service never started looks identical
          # to a working install until the first request.
          foreach ($service in 'W3SVC', 'WAS') {
            $state = (Get-Service $service -ErrorAction SilentlyContinue).Status
            Write-Host "$service = $state"
            if ($state -ne 'Running') { Write-Host "::error::$service is not running"; exit 1 }
          }

      - name: Deploy the site (deploy/3-deploy-portal.ps1)
        shell: powershell
        run: |
          try {
            # The shared instance, because the site runs as IIS APPPOOL\T5WebAdmin and a
            # private LocalDB instance belongs to the account that created it.
            ./src/T5Web/deploy/3-deploy-portal.ps1 -SitePath $env:publish -Port 8080 `
                -DataSource $env:T5_SERVER -Mode coexist
          } catch {
            Write-Host ("::error::3-deploy-portal.ps1: " + ($_.Exception.Message -replace "`r?`n", ' | '))
            exit 1
          }
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::3-deploy-portal.ps1 failed with $LASTEXITCODE"
            exit 1
          }

      # Now that the pool exists, its virtual account resolves, and SQL Server can be
      # told about it. The portal connects with integrated security, so this identity -
      # not t5web_admin, not the runner - is the one whose grants are exercised.
      - name: Grant the app pool identity (db/04)
        shell: powershell
        run: |
          # sqlcmd wants the value quoted *inside* the argument when it contains a space:
          # -v 'Name="IIS APPPOOL\X"'. Without the quotes it says "Invalid argument" and
          # no grant is applied - which is how this step first passed a broken command.
          sqlcmd -S $env:T5_SERVER -E -b -i src/T5Web/db/04-grant-app-pool-login.sql -d master `
                 -v 'AppPoolLogin="IIS APPPOOL\T5WebAdmin"'
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::db/04-grant-app-pool-login.sql failed'; exit 1 }

      - name: Show the web server versions
        shell: powershell
        run: |
          $iis = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\InetStp' -ErrorAction SilentlyContinue)
          $os = Get-CimInstance Win32_OperatingSystem
          Write-Host ("  OS       : {0} {1}" -f $os.Caption, $os.Version)
          Write-Host ("  IIS      : {0}.{1} (build {2})" -f $iis.MajorVersion, $iis.MinorVersion, $iis.MajorVersion*10 + $iis.MinorVersion)
          Import-Module WebAdministration
          $pool = Get-ItemProperty 'IIS:\AppPools\T5WebAdmin' -ErrorAction SilentlyContinue
          if ($pool) {
            Write-Host ("  app pool : managedRuntime={0} enable32Bit={1} identity={2}" -f `
                        $pool.managedRuntimeVersion, $pool.enable32BitAppOnWin64, $pool.processModel.identityType)
            if ($pool.enable32BitAppOnWin64 -ne $true) {
              Write-Host '::error::the app pool is not 32-bit, so the engine assemblies (x86) cannot load (BUG-34)'
              exit 1
            }
          } else {
            Write-Host '::error::app pool T5WebAdmin does not exist yet'
            exit 1
          }
          $net = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full').Release
          Write-Host "  NET FX   : release $net"
          Write-Host ("::notice::VERSIONS iis | OS {0} {1} | IIS {2}.{3} | app pool managedRuntime='{4}' enable32Bit={5} | .NET release {6}" -f `
                       $os.Caption, $os.Version, $iis.MajorVersion, $iis.MinorVersion, `
                       $pool.managedRuntimeVersion, $pool.enable32BitAppOnWin64, $net)

      - name: The app pool is the one the runbook describes
        shell: powershell
        run: |
          Import-Module WebAdministration
          $pool = Get-Item 'IIS:\AppPools\T5WebAdmin'

          # Read each value explicitly: $pool.$name does not resolve dotted paths, and
          # a wrong assertion here fails a correct installation.
          $actual = [ordered]@{
            'managedRuntimeVersion' = [string]$pool.managedRuntimeVersion
            'managedPipelineMode'   = [string]$pool.managedPipelineMode
            'startMode'             = [string]$pool.startMode
            'idleTimeout'           = ([TimeSpan]$pool.processModel.idleTimeout).ToString()
            'recyclingPeriodic'     = ([TimeSpan]$pool.recycling.periodicRestart.time).ToString()
            'enable32BitAppOnWin64' = [string][bool]$pool.enable32BitAppOnWin64
          }
          $expected = [ordered]@{
            'managedRuntimeVersion' = 'v4.0'
            'managedPipelineMode'   = 'Integrated'
            'startMode'             = 'AlwaysRunning'
            'idleTimeout'           = '00:00:00'
            'recyclingPeriodic'     = '00:00:00'
            'enable32BitAppOnWin64' = 'True'
          }
          $failed = $false
          foreach ($key in $expected.Keys) {
            $ok = ($actual[$key] -eq $expected[$key])
            Write-Host ("  {0,-22} {1,-14} {2}" -f $key, $actual[$key], $(if ($ok) { 'OK' } else { "EXPECTED $($expected[$key])" }))
            if (-not $ok) { Write-Host ("::error::app pool {0} is '{1}', expected '{2}'" -f $key, $actual[$key], $expected[$key]); $failed = $true }
          }

          $anonymous = (Get-WebConfigurationProperty -Filter '/system.webServer/security/authentication/anonymousAuthentication' `
                          -Name enabled -PSPath 'IIS:\Sites\T5WebAdmin').Value
          $windows = (Get-WebConfigurationProperty -Filter '/system.webServer/security/authentication/windowsAuthentication' `
                        -Name enabled -PSPath 'IIS:\Sites\T5WebAdmin').Value
          Write-Host "  anonymous=$anonymous windows=$windows"
          if ($anonymous -ne $false) { Write-Host '::error::anonymous authentication is enabled on the site'; $failed = $true }
          if ($windows -ne $true)   { Write-Host '::error::windows authentication is disabled on the site'; $failed = $true }

          $site = Get-Website -Name 'T5WebAdmin'
          Write-Host ("  site state {0}, pool {1}, path {2}" -f $site.State, $site.applicationPool, $site.physicalPath)
          if ($site.applicationPool -ne 'T5WebAdmin') { Write-Host "::error::the site is not using the T5WebAdmin pool"; $failed = $true }
          if ($site.State -ne 'Started') { Write-Host "::error::the site is $($site.State)"; $failed = $true }

          if ($failed) { exit 1 }
          Write-Host '  PASS: the installation matches docs/13 section 4'

      - name: Anonymous request is refused with 401
        shell: pwsh
        run: |
          $url = 'http://localhost:8080/Content/t5web-admin.css'
          # -SkipHttpErrorCheck returns the answer instead of throwing, which is the
          # only reliable way to read a non-2xx body: in PowerShell 7 the stream that
          # the exception carries is already gone.
          for ($i = 0; $i -lt 10; $i++) {
            $response = Invoke-WebRequest -Uri $url -UseBasicParsing -SkipHttpErrorCheck -MaximumRedirection 0
            $code = [int]$response.StatusCode
            Write-Host "  attempt $($i + 1): $code"
            if ($code -ne 500) { break }
            Start-Sleep -Seconds 3
          }

          if ($code -ne 401) {
            Write-Host "::error::anonymous request returned $code, expected 401 (Windows authentication)"

            # 1. The page itself: IIS/ASP.NET write the cause there ("Config Error",
            #    "Source File", "Line Number", the exception class and message).
            $text = [string]$response.Content
            $plain = ($text -replace '(?s)<script.*?</script>', ' ') -replace '<[^>]+>', ' '
            $plain = ($plain -replace '&nbsp;', ' ') -replace '\s+', ' '
            $plain = $plain.Trim()
            if ($plain.Length -gt 0) {
              Write-Host ('::error::body| ' + $plain.Substring(0, [Math]::Min(900, $plain.Length)))
            }

            # 2. ASP.NET logs the exception to the Application log even when the page
            #    is a generic one, so it survives customErrors.
            try {
              $entries = Get-WinEvent -FilterHashtable @{ LogName = 'Application'; Level = 1, 2 } -MaxEvents 6 -ErrorAction Stop
              foreach ($entry in $entries) {
                $message = ($entry.Message -replace '\s+', ' ').Trim()
                Write-Host ('::error::event| ' + $entry.ProviderName + ': ' + $message.Substring(0, [Math]::Min(600, $message.Length)))
              }
            } catch {
              Write-Host "  (no Application log entries: $($_.Exception.Message))"
            }
            exit 1
          }
          Write-Host '  PASS: anonymous is refused before MVC runs'

      - name: The console answers a Windows user
        shell: pwsh
        run: |-
          # Negotiate with the runner's own account. 200 or 302 proves IIS handed the
          # request to ASP.NET; 401 would mean the site still refuses authenticated
          # users. -SkipHttpErrorCheck keeps the answer readable whatever it is.
          $url = 'http://localhost:8080/Content/t5web-admin.css'
          $failure = ''
          $response = $null
          try {
            # -AllowUnencryptedAuthentication: PowerShell 7 refuses to send credentials
            # over http otherwise. It is localhost inside the runner; the customer's site
            # is reached over https or with the same flag on purpose.
            $response = Invoke-WebRequest -Uri $url -UseDefaultCredentials -UseBasicParsing `
                                              -MaximumRedirection 0 -SkipHttpErrorCheck `
                                              -AllowUnencryptedAuthentication -ErrorAction Stop
          } catch {
            # No HTTP answer at all: the worker process died, or nothing is listening.
            $failure = $_.Exception.Message
          }

          if (-not $response) {
            Write-Host "::error::the request failed before an HTTP answer: $failure"
            # A 32-bit worker that cannot start leaves no page behind, only event log
            # entries; print the ones that concern ASP.NET or WAS.
            Get-WinEvent -LogName 'Application', 'System' -MaxEvents 40 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'ASP\.NET|Application Error|WAS|IIS' } |
              Select-Object -First 6 |
              ForEach-Object {
                $message = ($_.Message -replace '\s+', ' ').Trim()
                Write-Host ('::error::event| ' + $_.ProviderName + ': ' + $message.Substring(0, [Math]::Min(500, $message.Length)))
              }
            exit 1
          }

          $code = [int]$response.StatusCode
          Write-Host "  status $code"
          if ($code -ne 200) {
            $plain = ($response.Content -replace '(?s)<script.*?</script>', ' ') -replace '<[^>]+>', ' '
            $plain = (($plain -replace '&nbsp;', ' ') -replace '\s+', ' ').Trim()
            $detail = if ($plain.Length -gt 0) { $plain.Substring(0, [Math]::Min(600, $plain.Length)) } else { '(empty body)' }
            Write-Host "::error::authenticated request returned $code, expected 200 - $detail"
            exit 1
          }
          $csp = $response.Headers['Content-Security-Policy']
          if (-not $csp) {
            Write-Host '::error::the site sends no Content-Security-Policy header'
            exit 1
          }
          Write-Host "  CSP: $csp"
          if ($csp -match 'unsafe-inline') {
            Write-Host '::error::the CSP allows unsafe-inline'
            exit 1
          }
          Write-Host '  PASS: authenticated request served, CSP present and strict'

      - name: Run the acceptance checklist against the site
        shell: powershell
        run: |
          # deploy/4-verify-install.ps1 is the checklist a customer runs after the
          # install, so it has to be executed somewhere. The database half needs the two
          # catalogs, which this job has not got, so only its IIS half must pass here.
          $output = @()
          $scriptExit = 0
          try {
            # *>&1, not 2>&1: the script reports with Write-Host, which in PowerShell 5
            # writes to the information stream - assigning the call without it captures
            # nothing, and the check then fails on an empty string (not on the site).
            $output = & ./src/T5Web/deploy/4-verify-install.ps1 -BaseUrl http://localhost:8080 *>&1
            $scriptExit = $LASTEXITCODE
          } catch {
            # The shell sets $ErrorActionPreference = 'Stop', so the first error the
            # script writes terminates it before it can report anything. Say which.
            Write-Host ("::error::4-verify-install.ps1 stopped early: " + $_.Exception.Message)
            $output = $_.ScriptStackTrace
          }
          # The script exits with its number of failures, and GitHub's powershell shell
          # forwards $LASTEXITCODE as the step result - which would fail the step for the
          # database checks we deliberately did not set up.
          $global:LASTEXITCODE = 0
          $output | ForEach-Object { Write-Host ([string]$_) }

          $text = ($output | Out-String)
          Write-Host ("  checklist exit code {0} (database checks need catalogs this job has not got)" -f $scriptExit)
          $failed = $false
          foreach ($check in 'bitness', 'auth-anonymous') {
            if ($text -notmatch ("PASS\s+" + $check)) {
              $flat = ($text -replace '\s+', ' ').Trim()
              Write-Host ("::error::4-verify-install.ps1 did not pass '$check' -> " + $flat.Substring(0, [Math]::Min(500, $flat.Length)))
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host '  PASS: the acceptance checklist runs and its IIS checks pass'
          exit 0

      # Everything above this line proves the door is locked. This proves what is
      # behind it: one authenticated request per controller, with a real database, so a
      # view that throws, a column that does not exist, or a query that reads the wrong
      # catalog fails here instead of at the customer's first click.
      - name: Open every screen as a signed-in administrator
        shell: pwsh
        run: |
          $root = 'http://localhost:8080'
          $failure = ''
          $visited = 0
          $failures = @()

          # Enumerated from source, so a new controller is covered without anyone
          # remembering to add it here.
          $controllers = Get-ChildItem 'src/T5Web/T5Web.Web/Controllers' -Filter *.cs |
            ForEach-Object { $_.BaseName -replace 'Controller$', '' } |
            Where-Object { $_ -notin @('Home', 'Account') } |
            Sort-Object -Unique

          foreach ($name in $controllers) {
            $url = "$root/$name"
            try {
              $response = Invoke-WebRequest -Uri $url -UseDefaultCredentials -UseBasicParsing `
                  -MaximumRedirection 0 -SkipHttpErrorCheck -AllowUnencryptedAuthentication -ErrorAction Stop
              $code = [int]$response.StatusCode
              $body = [string]$response.Content
            } catch {
              $code = 0
              $body = ''
              $failure = $_.Exception.Message
            }
            $visited++
            # The yellow screen puts its stylesheet and scripts before the message, so
            # strip those first: a "Compilation Error" that quotes only CSS is useless.
            $plain = $body -replace '(?s)<script.*?</script>', ' ' -replace '(?s)<style.*?</style>', ' '
            $plain = ($plain -replace '<[^>]+>', ' ') -replace '&nbsp;', ' '
            $plain = ($plain -replace '\s+', ' ').Trim()
            if ($code -ne 200) {
              # Keep the sentences that name the cause, not the boilerplate around them.
              $key = @()
              foreach ($needle in 'error CS', 'Compilation Error', 'Parser Error', 'Description:', 'Exception', 'Line ') {
                $at = $plain.IndexOf($needle)
                if ($at -ge 0) { $key += $plain.Substring($at, [Math]::Min(240, $plain.Length - $at)) }
              }
              $detail = if ($key.Count -gt 0) { ($key -join ' || ') } elseif ($plain.Length -gt 0) { $plain.Substring(0, [Math]::Min(240, $plain.Length)) } else { $failure }
              $failures += ("{0,-14} {1,3}  {2}" -f $name, $code, $detail)
              continue
            }
            # A 200 with the "no access" page means the fixture, not the screen, is wrong.
            if ($body -match 'دسترسی ندارید|NoAccess') { $failures += ("{0,-14} 200  the no-access page instead of the screen" -f $name) }
          }

          if ($failures.Count -gt 0) {
            foreach ($line in $failures) { Write-Host "::error::screen $line" }
            exit 1
          }
          Write-Host "  PASS: $visited screens answered 200 for a signed-in administrator"

          # The screens answered, but did they read the database? The fixture row has a
          # name nobody else could produce, so finding it proves the whole path:
          # IIS -> ASP.NET -> Dapper -> [Personnel] -> the view.
          $searched = Invoke-WebRequest -Uri "$root/Personnel?term=آزمون" -UseDefaultCredentials `
              -UseBasicParsing -SkipHttpErrorCheck -AllowUnencryptedAuthentication
          if ([string]$searched.Content -notmatch 'نصب') {
            $plain = (([string]$searched.Content -replace '<[^>]+>', ' ') -replace '\s+', ' ')
            Write-Host ("::error::the personnel screen did not show the fixture row: " + $plain.Substring(0, [Math]::Min(400, $plain.Length)))
            exit 1
          }
          Write-Host '  PASS: the personnel screen reads the Personnel catalog'

          # Diagnostics prints the connection state; "برقرار" is the reachable badge.
          $diagnostics = Invoke-WebRequest -Uri "$root/Diagnostics" -UseDefaultCredentials `
              -UseBasicParsing -SkipHttpErrorCheck -AllowUnencryptedAuthentication
          if ([string]$diagnostics.Content -notmatch 'برقرار') {
            $plain = (([string]$diagnostics.Content -replace '<[^>]+>', ' ') -replace '\s+', ' ')
            Write-Host ("::error::the diagnostics page does not report a live connection: " + $plain.Substring(0, [Math]::Min(400, $plain.Length)))
            exit 1
          }
          Write-Host '  PASS: the diagnostics page reports a live database connection'

      # Rendering a screen proves the read path. This proves the write path end to end:
      # a POST as the app pool identity through MVC - routing, antiforgery, AdminGate,
      # the repository's UPDATE, SQL Server - and then reads the row back, because a
      # flash message is not evidence that a row changed (BUG-43).
      - name: An administrator can actually save
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Sql([string]$query) {
            return ((sqlcmd -S $env:T5_SERVER -E -b -h -1 -W -d Personnel -Q "SET NOCOUNT ON; $query" 2>&1) |
                    Where-Object { $_ -match '\S' }) -join ' '
          }

          try {
            # A parent to move something into: the fixture's own department is a root, so
            # moving it to "no parent" would change nothing and prove nothing. The name is
            # ASCII on purpose - sqlcmd hands -Q to the server in the console code page, and
            # this step must fail for permission reasons, never for encoding ones.
            $temp = 'CI-VERIFY-PARENT'
            $seeded = Sql "IF NOT EXISTS (SELECT 1 FROM [dbo].[Department] WHERE [DepartmentName] = N'$temp')
                   INSERT INTO [dbo].[Department] ([DepartmentName], [Name], [UpperDeptID])
                       VALUES (N'$temp', N'$temp', 0);
                 SELECT [DepartmentID] FROM [dbo].[Department] WHERE [DepartmentName] = N'$temp';"
            $parent = ($seeded -split '\s+' | Where-Object { $_ -match '^\d+$' } | Select-Object -Last 1)
            $child  = Sql "SELECT TOP 1 [DepartmentID] FROM [dbo].[Department] WHERE ISNULL([UpperDeptID], 0) = 0 AND [DepartmentName] <> N'$temp' ORDER BY [DepartmentID]"
            Write-Host "  parent='$parent' child='$child' (seeded: $seeded)"
            if ($parent -notmatch '^\d+$' -or $child -notmatch '^\d+$') {
              throw "could not set up the two departments (parent='$parent', child='$child')"
            }

            $session = New-Object Microsoft.PowerShell.Commands.WebRequestSession
            # -AllowUnencryptedAuthentication: PowerShell 7 refuses to send credentials
            # over plain http without it, and IIS here is http on purpose (no certificate
            # in a test job). It says so in an error that reads like a site failure.
            $page = Invoke-WebRequest -Uri 'http://localhost:8080/Department' -UseDefaultCredentials `
                      -AllowUnencryptedAuthentication -WebSession $session
            Write-Host ("  GET /Department -> {0}, {1} bytes" -f $page.StatusCode, $page.Content.Length)
            $token = [regex]::Match([string]$page.Content, 'name="__RequestVerificationToken"[^>]*value="([^"]+)"')
            if (-not $token.Success) {
              $flat = ([string]$page.Content -replace '<[^>]+>', ' ' -replace '\s+', ' ').Trim()
              throw ("the department screen carries no antiforgery token, so no form on it can post - " +
                     "the page the portal returned says: " + $flat.Substring(0, [Math]::Min(300, $flat.Length)))
            }

            # Not "Move": that is a built-in alias for Move-Item, and aliases win over
            # functions, so Move 2 tried to move a file called 2.
            function Invoke-Move([int]$to) {
              $body = @{
                __RequestVerificationToken = $token.Groups[1].Value
                departmentId               = $child
                newParentId                = $to
              }
              return Invoke-WebRequest -Uri 'http://localhost:8080/Department/Move' -Method Post `
                -Body $body -UseDefaultCredentials -AllowUnencryptedAuthentication `
                -WebSession $session -MaximumRedirection 5
            }

            $response = Invoke-Move $parent
            Write-Host ("  POST /Department/Move -> {0}, landed on {1}" -f $response.StatusCode, $response.BaseResponse.ResponseUri)
            $after = Sql "SELECT ISNULL([UpperDeptID], 0) FROM [dbo].[Department] WHERE [DepartmentID] = $child"
            if ($after -ne "$parent") {
              throw ("the move was accepted but the row still has UpperDeptID=$after instead of $parent - " +
                     "the portal is not reaching the table it draws (catalog or permission)")
            }
            Write-Host "  PASS: department $child now sits under $parent"

            $response = Invoke-Move 0
            $back = Sql "SELECT ISNULL([UpperDeptID], 0) FROM [dbo].[Department] WHERE [DepartmentID] = $child"
            if ($back -ne '0') { throw "the second move left UpperDeptID=$back instead of 0" }
            Write-Host '  PASS: and back again, so the write is repeatable'

            Sql "DELETE FROM [dbo].[Department] WHERE [DepartmentID] = $parent" | Out-Null
            Write-Host '  the audit rows this wrote stay: they are the evidence.'
          }
          catch {
            Write-Host ("::error::the portal cannot save: " + $_.Exception.Message)
            exit 1
          }

      # The pool identity is what SQL Server sees, so its rights are the ones that
      # matter. db/02 states them; db/verify-grants.sql asks SQL Server, inside
      # EXECUTE AS LOGIN, once per catalog - a permission is granted per database.
      - name: The pool identity is least-privileged
        shell: pwsh
        run: |
          $failed = $false
          $reports = @()
          foreach ($catalog in @('ReportT5V3', 'Personnel')) {
            $out = (sqlcmd -S $env:T5_SERVER -E -b -h -1 -W -d $catalog -v 'Login="IIS APPPOOL\T5WebAdmin"' -i ./src/T5Web/db/verify-grants.sql 2>&1) -join "`n"
            $code = $LASTEXITCODE
            Write-Host "--- $catalog"
            $out -split "`n" | ForEach-Object { Write-Host ("  " + $_) }
            if ($code -ne 0) {
              # Name the checks that failed: an annotation is the only part of this log
              # the run page shows, so "the grants are wrong" alone is not an answer.
              $bad = ($out -split "`n" | Where-Object { $_ -match 'FAIL|Msg |error' } | ForEach-Object { $_.Trim() }) -join ' ; '
              if (-not $bad) { $bad = ($out -replace '\s+', ' ').Trim() }
              if ($bad.Length -gt 900) { $bad = $bad.Substring(0, 900) }
              $reports += "$catalog (exited $code): $bad"
              $failed = $true
            }
          }
          if ($failed) {
            Write-Host ("::error::the pool identity does not hold the permissions the screens need - " +
                        "the grants are wrong (db/02, db/04): " + ($reports -join ' || '))
            exit 1
          }
          Write-Host '  PASS: the pool identity holds exactly the permissions the screens need'

      - name: Show the IIS log tail on failure
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:SystemDrive 'inetpub\logs\LogFiles'
          if (Test-Path $log) {
            Get-ChildItem $log -Recurse -Filter *.log |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1 |
              ForEach-Object { Get-Content $_.FullName -Tail 40 | ForEach-Object { Write-Host "iis| $_" } }
          }
          foreach ($eventLog in 'System', 'Application') {
            Get-EventLog -LogName $eventLog -Newest 10 -EntryType Error -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("{0}| {1}" -f $eventLog, $_.Message.Split("`n")[0]) }
          }

  database:
    name: SQL Server scripts
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      T5_SERVER: '(localdb)\T5Web'
    steps:
      - uses: actions/checkout@v4

      - name: Start LocalDB
        shell: pwsh
        run: |
          sqllocaldb create T5Web -s
          sqllocaldb info T5Web
          sqlcmd -S "(localdb)\T5Web" -E -Q "SELECT @@VERSION" -h -1 -W
          if ($LASTEXITCODE -ne 0) { throw "LocalDB did not start" }

      # The runbook promises "SQL Server 2016 or newer". This is where that promise is
      # checked instead of assumed: product version, edition and compatibility level,
      # read from the engine itself.
      - name: Show the SQL Server version
        shell: pwsh
        run: |
          $q = @"
          SET NOCOUNT ON;
          SELECT CONCAT('product=', CONVERT(varchar(30), SERVERPROPERTY('ProductVersion')),
                        '|level=',   CONVERT(varchar(10), SERVERPROPERTY('ProductLevel')),
                        '|edition=', CONVERT(varchar(60), SERVERPROPERTY('Edition')),
                        '|engine=',  CONVERT(varchar(10), SERVERPROPERTY('EngineEdition')),
                        '|major=',   CONVERT(varchar(10), SERVERPROPERTY('ProductMajorVersion')));
          SELECT CONCAT('version=', @@VERSION);
          SELECT CONCAT('compat=', CONVERT(varchar(10), compatibility_level)) FROM sys.databases WHERE name = 'master';
          "@
          $out = (sqlcmd -S '(localdb)\T5Web' -E -b -h -1 -W -Q $q 2>&1) -join ' '
          Write-Host "  $out"
          $major = [int]([regex]::Match($out, 'major=(\d+)').Groups[1].Value)
          if (-not $major) { Write-Host '::error::could not read the SQL Server major version' ; exit 1 }
          if ($major -lt 13) {
            Write-Host "::error::SQL Server $major is older than 2016 (13.x); the runbook requires 2016 or newer"
            exit 1
          }
          $name = @{ 13 = '2016'; 14 = '2017'; 15 = '2019'; 16 = '2022'; 17 = '2025' }[[int]$major]
          Write-Host "  PASS: SQL Server $major ($name) - the runbook's floor is 2016 (13.x)"
          Write-Host ("::notice::VERSIONS sql | {0} | {1}" -f $name, ($out -replace '\s+', ' '))

      # An empty engine schema would make every script here meaningless, so the fixture is
      # generated from engine/column-types.json - the same model the build gates use.
      - name: Build the synthetic engine schema
        shell: pwsh
        run: |
          python src/T5Web/tools/synthetic-schema.py --check
          python src/T5Web/tools/synthetic-schema.py --sql > synthetic.sql
          sqlcmd -S "(localdb)\T5Web" -E -b -i synthetic.sql -d master -f 65001
          if ($LASTEXITCODE -ne 0) { throw "synthetic schema failed with $LASTEXITCODE" }

      - name: Portal objects and the least-privilege login
        shell: pwsh
        run: |
          function Invoke-SqlScript([string]$path, [string]$database) {
            Write-Host "--- $path"
            # -b: without it sqlcmd exits 0 on a syntax error, and this job reported
            # "success" for a file whose every GRANT was rejected (BUG-36).
            $out = sqlcmd -S "(localdb)\T5Web" -E -b -i $path -d $database -f 65001 2>&1
            $code = $LASTEXITCODE
            $out | Write-Host
            if ($code -ne 0) {
              foreach ($line in ($out | Select-Object -First 20)) { Write-Host "::error::${path}: $_" }
              throw "$path failed with $code"
            }
          }
          Invoke-SqlScript 'src/T5Web/db/01-t5web-objects.sql' 'ReportT5V3'
          Invoke-SqlScript 'src/T5Web/db/02-t5web-sql-login.sql'  'ReportT5V3'
          # Second run must be a no-op: both scripts are documented as idempotent.
          Invoke-SqlScript 'src/T5Web/db/01-t5web-objects.sql' 'ReportT5V3'

      - name: verify.sql must report no MISSING
        shell: pwsh
        run: |
          $out = sqlcmd -S "(localdb)\T5Web" -E -i src/T5Web/db/verify.sql -d ReportT5V3 -h -1 -W -f 65001 2>&1
          $out | Write-Host
          $missing = $out | Select-String -Pattern 'MISSING'
          if ($missing) {
            foreach ($line in ($missing | Select-Object -First 25)) { Write-Host "::error::verify: $line" }
            throw "verify.sql reports $($missing.Count) MISSING object(s)"
          }

      - name: 03-relations.sql must report no VIOLATION
        shell: pwsh
        run: |
          $out = sqlcmd -S "(localdb)\T5Web" -E -i src/T5Web/db/03-relations.sql -d ReportT5V3 -h -1 -W -f 65001 2>&1
          $out | Write-Host
          $bad = $out | Select-String -Pattern 'VIOLATION'
          if ($bad) {
            foreach ($line in ($bad | Select-Object -First 25)) { Write-Host "::error::relations: $line" }
            throw "03-relations.sql reports $($bad.Count) violation(s)"
          }

      - name: Migration fingerprint round trip
        shell: pwsh
        run: |
          function Invoke-Fingerprint([string]$outFile) {
            $text = sqlcmd -S "(localdb)\T5Web" -E -b -i fingerprint.sql -h -1 -W -f 65001 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              foreach ($line in ($text | Select-Object -First 20)) { Write-Host "::error::fingerprint sqlcmd: $line" }
              throw "the fingerprint script failed with $code"
            }
            $tables = @($text | Where-Object { $_ -match '^\s*table\|' })
            if ($tables.Count -lt 80) {
              foreach ($line in ($text | Select-Object -First 20)) { Write-Host "::error::fingerprint output: $line" }
              throw "the fingerprint produced $($tables.Count) table lines, expected 80+"
            }
            $text | Set-Content -LiteralPath $outFile -Encoding ascii
            Write-Host "$outFile : $($tables.Count) table lines"
          }

          python src/T5Web/tools/migration-fingerprint.py --sql > fingerprint.sql
          Invoke-Fingerprint 'fingerprint-a.txt'
          Invoke-Fingerprint 'fingerprint-b.txt'
          $out = python src/T5Web/tools/migration-fingerprint.py --compare fingerprint-a.txt fingerprint-b.txt 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in $out) { Write-Host "::error::fingerprint: $line" }
            throw 'the fingerprint comparison failed'
          }

      - name: Portal SQL statements against the real engine
        shell: pwsh
        run: |
          $out = python src/T5Web/tools/sql-smoke.py --server '(localdb)\T5Web' -d ReportT5V3 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in ($out | Select-String -Pattern 'FAIL|Msg \d+|Invalid' | Select-Object -First 25)) {
              Write-Host "::error::smoke: $line"
            }
            throw 'SQL smoke failed'
          }

  # The question "can this move to .NET 8?" is not answered by an opinion. It is
  # answered by compiling the three lower layers against net8.0 and counting what
  # breaks. Runs on Linux on purpose: if the core needs Windows APIs, the port is
  # bigger than it looks, and this job says so before anyone plans a sprint around it.
  net8-spike:
    name: Portability - the core on .NET 8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # Both, because the question is about .NET 10 and the fallback target is .NET 8.
          dotnet-version: |
            8.0.x
            10.0.x

      # The claim under test, measured rather than remembered.
      - name: Count what couples the core to .NET Framework
        shell: bash
        run: |
          set -eu
          # GitHub's bash runs with -e -o pipefail, so a grep that finds nothing (exit 1)
          # would abort the step before it can report. Each count therefore tolerates it.
          count() { { "$@" || true; } | wc -l; }
          core=$(count find src/T5Web/T5Web.Domain src/T5Web/T5Web.Application src/T5Web/T5Web.Data -name '*.cs' -not -path '*/obj/*')
          engine=$(count grep -rl --include='*.cs' -E '^using (Personnel|T5V3)\.' src/T5Web/T5Web.Domain src/T5Web/T5Web.Application src/T5Web/T5Web.Data)
          web=$(count grep -rl --include='*.cs' '^using System\.Web' src/T5Web/T5Web.Domain src/T5Web/T5Web.Application src/T5Web/T5Web.Data)
          config=$(count grep -rl --include='*.cs' 'System\.Configuration' src/T5Web/T5Web.Domain src/T5Web/T5Web.Application src/T5Web/T5Web.Data)
          echo "  core files            : $core"
          echo "  use the engine (x86)  : $engine"
          echo "  use System.Web        : $web"
          echo "  use System.Configuration : $config"
          echo "::notice::NET8 coupling | core files $core | engine-coupled $engine | System.Web $web | System.Configuration $config"
          # One file may still reference the engine: PersonnelEngineDirectory, kept so an
          # installation can compare the two readers during cut-over. It is excluded from
          # the net8/net10 build by name. A second one would be silently dropped, so say so.
          if [ "$engine" -gt 1 ]; then
            echo "::error::at most one core file may use the engine (PersonnelEngineDirectory.cs); found $engine. The portable build excludes that file by name, so an extra one would vanish unnoticed."
            exit 1
          fi
          grep -rl --include='*.cs' -E '^using (Personnel|T5V3)\.' src/T5Web/T5Web.Domain src/T5Web/T5Web.Application src/T5Web/T5Web.Data > engine-uses.txt || true
          if [ -s engine-uses.txt ] && ! grep -qx 'src/T5Web/T5Web.Data/Engine/PersonnelEngineDirectory.cs' engine-uses.txt; then
            echo "::error::the engine is used somewhere other than PersonnelEngineDirectory.cs:"
            cat engine-uses.txt
            exit 1
          fi
          # The portal must run on SQL by default; the engine is opt-in for cut-over only.
          # -z: the call is split over three lines, and a line-based grep cannot see that.
          if ! tr '\n' ' ' < src/T5Web/T5Web.Web/MvcApplication.cs | grep -q 'EngineDirectory.Create(.*EngineDirectory.Key'; then
            echo "::error::MvcApplication must choose the directory reader from T5WebEngineDirectory, so a deployment can run without the engine assemblies"
            exit 1
          fi
          if [ "$web" -ne 0 ] || [ "$config" -ne 0 ]; then
            echo "::error::the core must stay free of System.Web and System.Configuration, or a .NET 8 port inherits the whole web stack"
            exit 1
          fi

      - name: The distance to ASP.NET Core must only shrink
        shell: bash
        run: |
          python3 src/T5Web/tools/web-port-budget.py --check
      # Every file that still needs System.Web, so the port work list is a fact and not
      # a memory. Only printed; the budget step above is what fails.
      - name: What still couples the web layer
        if: always()
        shell: bash
        run: |
          python3 src/T5Web/tools/web-port-budget.py --list

      # TWF's web layer calls the T5 engine 401 times in 36 files - that, not the
      # framework, is what stands between it and .NET 10. docs/18 is the plan; this is
      # the number it has to move, and it may only go down.
      - name: TWF's distance to .NET 10 must only shrink
        shell: bash
        run: |
          python3 src/TWF/tools/port-budget.py --check

      - name: What still couples TWF
        if: always()
        shell: bash
        run: |
          python3 src/TWF/tools/port-budget.py --list | head -60

      - name: Build the core for net8.0 and net10.0
        shell: bash
        run: |
          set -o pipefail
          dotnet --list-sdks
          for tfm in net8.0 net10.0; do
            echo "--- $tfm"
            # Every error, then the counts: "how far from compiling" should be a number.
            dotnet build src/T5Web/spike/net8/Net8Spike.csproj -c Release -f "$tfm" -v minimal 2>&1 | tee "build-$tfm.log"
            status=${PIPESTATUS[0]}
            errors=$(grep -cE ': error ' "build-$tfm.log" || true)
            warnings=$(grep -cE ': warning ' "build-$tfm.log" || true)
            echo "::notice::$tfm build | errors $errors | warnings $warnings"
            if [ "$status" -ne 0 ]; then
              echo "::error::the core does not compile on $tfm yet: $errors error(s). See docs/16-net8-feasibility.md."
              grep -E ': error ' "build-$tfm.log" | sort -u | head -20
              exit 1
            fi
            echo "  PASS: Domain, Application and Data compile as $tfm with Dapper only"
          done

      - name: Report the porting surface that remains
        shell: bash
        run: |
          set -eu
          count() { { "$@" || true; } | wc -l; }
          views=$(count find src/T5Web/T5Web.Web -name '*.cshtml')
          controllers=$(count find src/T5Web/T5Web.Web -name '*Controller.cs')
          systemweb=$(count grep -rl --include='*.cs' '^using System\.Web' src/T5Web/T5Web.Web)
          cs=$(count find src/T5Web/T5Web.Web -name '*.cs' -not -path '*/obj/*')
          echo "  web .cs files         : $cs"
          echo "  of which System.Web   : $systemweb"
          echo "  controllers           : $controllers"
          echo "  Razor views           : $views"
          echo "::notice::NET8 web surface | controllers $controllers | views $views | System.Web files $systemweb/$cs"

  twf-framework-diagnostic:
    # Raw TWF.sln fails missing references (40395889978); an unchanged-source
    # shadow fails unqualified Init (40396626924). CI tests a temp copy with
    # exactly ONE explicitly recorded qualification; NEVER call this raw parity.
    name: TWF Framework diagnostic shadow + 47 tests (not raw baseline)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Compile complete TWF sources using an isolated metadata shadow
        shell: pwsh
        run: ./src/net10/tools/test-twf-shadow.ps1 -DiagnosticPatch

  net10-ledger:
    name: Roslyn inventory (preinstalled .NET 10, offline restore)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Require local SDK and compile Roslyn inventory without package sources
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dotnet >/dev/null || ! dotnet --list-sdks | grep -Eq '^10\.0\.[0-9]+'; then
            echo '::error::NEEDS-INFRA: no preinstalled .NET 10 SDK on this runner (no download fallback).'
            exit 2
          fi
          sdk=$(dotnet --list-sdks | grep '^10\.0\.' | head -n 1)
          echo "::notice::NET10 inventory toolchain | $sdk | SDK-provided Roslyn | offline NuGet config"
          dotnet restore src/net10/tools/LedgerGenerator/LedgerGenerator.csproj \
            --configfile src/net10/nuget.offline.config -v minimal
          dotnet build src/net10/tools/LedgerGenerator/LedgerGenerator.csproj \
            -c Release --no-restore -v minimal
      - name: Generate and validate source, view, config, SQL and DLL inventory
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project src/net10/tools/LedgerGenerator/LedgerGenerator.csproj \
            --no-build --no-restore -c Release -- "$GITHUB_WORKSPACE" "$RUNNER_TEMP/LEDGER.csv"
          python3 src/net10/tools/ledger-check.py --inventory "$RUNNER_TEMP/LEDGER.csv"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: roslyn-ledger
          path: ${{ runner.temp }}/LEDGER.csv
          if-no-files-found: error
          retention-days: 7
