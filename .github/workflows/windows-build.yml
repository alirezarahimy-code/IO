name: windows-build

# The rewrite targets .NET Framework 4.7.2 + IIS + SQL Server, and none of that exists
# on the Linux machine where the code is written. This workflow is that Windows machine:
# it compiles with MSBuild, runs the 35-test suite, and proves the database scripts
# against a real SQL Server engine (Express LocalDB, which the runner image already has).
#
# It is deliberately push-triggered: a red run here is the same signal a red build on
# the customer's server would give, only earlier.
#
# Note on diagnostics: job logs live in Azure blob storage, which an offline review
# environment cannot read. Every step therefore re-prints a failing output as an
# `::error::` annotation, which is readable through the API (gh run view).

on:
  push:
    branches: ['**']
    paths:
      - 'src/T5Web/**'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'src/T5Web/**'
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: MSBuild + tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show toolchain
        shell: pwsh
        run: |
          $msbuild = (Get-Command msbuild -ErrorAction SilentlyContinue).Source
          $sqlcmd  = (Get-Command sqlcmd  -ErrorAction SilentlyContinue).Source
          Write-Host "MSBuild : $msbuild"
          Write-Host "sqlcmd  : $sqlcmd"
          Write-Host "python  : $((Get-Command python -ErrorAction SilentlyContinue).Source)"
          if (-not $msbuild) { Write-Host '::error::MSBuild is not on PATH' ; exit 1 }
          msbuild -version

      # The static gates run on Linux too; running them here proves they do not depend on
      # the developer machine. dnfile is needed by the engine-metadata gates.
      - name: Static gates
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --quiet dnfile
          bash src/T5Web/build-and-test.sh --gates
          if ($LASTEXITCODE -ne 0) { throw "static gates failed with $LASTEXITCODE" }

      - name: Build (Release)
        shell: pwsh
        run: |
          $out = msbuild src/T5Web/T5Web.sln /p:Configuration=Release /m /v:minimal /nologo 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $errors = $out | Select-String -Pattern ': error ' | Select-Object -First 25
            foreach ($line in $errors) { Write-Host "::error::$line" }
            throw "MSBuild failed with $LASTEXITCODE"
          }

      - name: Run the suite
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Filter T5Web.Tests.exe | Select-Object -First 1
          if (-not $exe) { Write-Host '::error::T5Web.Tests.exe was not produced'; exit 1 }
          Write-Host "running $($exe.FullName)"
          $out = & $exe.FullName 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            ($out | Select-String -Pattern 'FAIL|Failure|Expected|Unhandled' | Select-Object -First 20) |
              ForEach-Object { Write-Host "::error::$_" }
            throw "test suite failed with exit code $LASTEXITCODE"
          }

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t5web-release
          path: |
            src/T5Web/T5Web.Web/bin/Release
            src/T5Web/T5Web.Tests/bin/Release
          retention-days: 7
          if-no-files-found: warn

  iis-install:
    name: IIS + the published console
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      # This job installs the product the way the customer will: publish a folder,
      # enable the IIS roles, create the pool and the site, then ask IIS itself
      # whether an anonymous request is refused. It is the deployment kit executed,
      # not described.
      - name: Publish the console
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'T5WebAdmin'
          ./src/T5Web/deploy/0-publish.ps1 -OutputPath $out -Build
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::error::0-publish.ps1 failed'
            exit 1
          }
          "publish=$out" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem $out | Select-Object Name, Length | Format-Table | Out-String | Write-Host

      - name: Install IIS (deploy/1-install-iis.ps1)
        shell: pwsh
        run: |
          ./src/T5Web/deploy/1-install-iis.ps1 -NoRebootPrompt
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::1-install-iis.ps1 failed with $LASTEXITCODE"
            exit 1
          }
          # A feature that is enabled but whose service never started looks identical
          # to a working install until the first request.
          foreach ($service in 'W3SVC', 'WAS') {
            $state = (Get-Service $service -ErrorAction SilentlyContinue).Status
            Write-Host "$service = $state"
            if ($state -ne 'Running') { Write-Host "::error::$service is not running"; exit 1 }
          }

      - name: Deploy the site (deploy/3-deploy-portal.ps1)
        shell: pwsh
        run: |
          ./src/T5Web/deploy/3-deploy-portal.ps1 -SitePath $env:publish -Port 8080 `
              -DataSource '(localdb)\T5Web' -Mode coexist
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::3-deploy-portal.ps1 failed with $LASTEXITCODE"
            exit 1
          }

      - name: The app pool is the one the runbook describes
        shell: pwsh
        run: |
          Import-Module WebAdministration
          $pool = Get-Item 'IIS:\AppPools\T5WebAdmin'
          $checks = @{
            managedRuntimeVersion = 'v4.0'
            managedPipelineMode   = 'Integrated'
            startMode             = 'AlwaysRunning'
            'processModel.idleTimeout' = '00:00:00'
          }
          foreach ($key in $checks.Keys) {
            if ($key -eq 'managedRuntimeVersion' -or $key -eq 'managedPipelineMode' -or $key -eq 'startMode') {
              $actual = $pool.$key
            } else {
              $actual = $pool.processModel.idleTimeout.ToString()
            }
            Write-Host "  $key = $actual"
            if ("$actual" -ne "$($checks[$key])") {
              Write-Host ("::error::app pool {0} is {1}, expected {2}" -f $key, $actual, $checks[$key])
              exit 1
            }
          }
          $anonymous = (Get-WebConfigurationProperty -Filter '/system.webServer/security/authentication/anonymousAuthentication' `
                          -Name enabled -PSPath 'IIS:\Sites\T5WebAdmin').Value
          $windows = (Get-WebConfigurationProperty -Filter '/system.webServer/security/authentication/windowsAuthentication' `
                        -Name enabled -PSPath 'IIS:\Sites\T5WebAdmin').Value
          Write-Host "  anonymous=$anonymous windows=$windows"
          if ($anonymous -ne $false) { Write-Host '::error::anonymous authentication is enabled on the site'; exit 1 }
          if ($windows -ne $true)   { Write-Host '::error::windows authentication is disabled on the site'; exit 1 }

      - name: Anonymous request is refused with 401
        shell: pwsh
        run: |
          $url = 'http://localhost:8080/Content/t5web-admin.css'
          for ($i = 0; $i -lt 10; $i++) {
            try {
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -MaximumRedirection 0 -ErrorAction Stop
              $code = [int]$response.StatusCode
            } catch {
              $code = [int]$_.Exception.Response.StatusCode
            }
            Write-Host "  attempt $($i + 1): $code"
            if ($code -ne 0 -and $code -ne 500) { break }
            Start-Sleep -Seconds 3
          }
          if ($code -ne 401) {
            Write-Host "::error::anonymous request returned $code, expected 401 (Windows authentication)"
            exit 1
          }
          Write-Host '  PASS: anonymous is refused before MVC runs'

      - name: The console answers a Windows user
        shell: pwsh
        run: |
          # Negoiate with the runner's own account. A 200 or a 302 proves IIS handed the
          # request to ASP.NET; a 401 would mean the site still refuses authenticated users.
          $url = 'http://localhost:8080/Content/t5web-admin.css'
          try {
            $response = Invoke-WebRequest -Uri $url -UseDefaultCredentials -UseBasicParsing -MaximumRedirection 0 -ErrorAction Stop
            $code = [int]$response.StatusCode
            $headers = $response.Headers
          } catch {
            $code = [int]$_.Exception.Response.StatusCode
            $headers = @{}
          }
          Write-Host "  status $code"
          if ($code -ne 200) {
            Write-Host "::error::authenticated request returned $code, expected 200"
            exit 1
          }
          $csp = $headers['Content-Security-Policy']
          if (-not $csp) {
            Write-Host "::error::the site sends no Content-Security-Policy header"
            exit 1
          }
          Write-Host "  CSP: $csp"
          if ($csp -match 'unsafe-inline') {
            Write-Host '::error::the CSP allows unsafe-inline'
            exit 1
          }
          Write-Host '  PASS: authenticated request served, CSP present and strict'

      - name: Show the IIS log tail on failure
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:SystemDrive 'inetpub\logs\LogFiles'
          if (Test-Path $log) {
            Get-ChildItem $log -Recurse -Filter *.log |
              Sort-Object LastWriteTime -Descending | Select-Object -First 1 |
              ForEach-Object { Get-Content $_.FullName -Tail 40 | ForEach-Object { Write-Host "::error::iis| $_" } }
          }
          foreach ($eventLog in 'System', 'Application') {
            Get-EventLog -LogName $eventLog -Newest 10 -EntryType Error -ErrorAction SilentlyContinue |
              ForEach-Object { Write-Host ("::error::{0}| {1}" -f $eventLog, $_.Message.Split("`n")[0]) }
          }

  database:
    name: SQL Server scripts
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      T5_SERVER: '(localdb)\T5Web'
    steps:
      - uses: actions/checkout@v4

      - name: Start LocalDB
        shell: pwsh
        run: |
          sqllocaldb create T5Web -s
          sqllocaldb info T5Web
          sqlcmd -S "(localdb)\T5Web" -E -Q "SELECT @@VERSION" -h -1 -W
          if ($LASTEXITCODE -ne 0) { throw "LocalDB did not start" }

      # An empty engine schema would make every script here meaningless, so the fixture is
      # generated from engine/column-types.json - the same model the build gates use.
      - name: Build the synthetic engine schema
        shell: pwsh
        run: |
          python src/T5Web/tools/synthetic-schema.py --check
          python src/T5Web/tools/synthetic-schema.py --sql > synthetic.sql
          sqlcmd -S "(localdb)\T5Web" -E -b -i synthetic.sql -d master -f 65001
          if ($LASTEXITCODE -ne 0) { throw "synthetic schema failed with $LASTEXITCODE" }

      - name: Portal objects and the least-privilege login
        shell: pwsh
        run: |
          function Invoke-SqlScript([string]$path, [string]$database) {
            Write-Host "--- $path"
            $out = sqlcmd -S "(localdb)\T5Web" -E -i $path -d $database -f 65001 2>&1
            $code = $LASTEXITCODE
            $out | Write-Host
            if ($code -ne 0) {
              foreach ($line in ($out | Select-Object -First 20)) { Write-Host "::error::${path}: $_" }
              throw "$path failed with $code"
            }
          }
          Invoke-SqlScript 'src/T5Web/db/01-t5web-objects.sql' 'ReportT5V3'
          Invoke-SqlScript 'src/T5Web/db/02-t5web-sql-login.sql'  'ReportT5V3'
          # Second run must be a no-op: both scripts are documented as idempotent.
          Invoke-SqlScript 'src/T5Web/db/01-t5web-objects.sql' 'ReportT5V3'

      - name: verify.sql must report no MISSING
        shell: pwsh
        run: |
          $out = sqlcmd -S "(localdb)\T5Web" -E -i src/T5Web/db/verify.sql -d ReportT5V3 -h -1 -W -f 65001 2>&1
          $out | Write-Host
          $missing = $out | Select-String -Pattern 'MISSING'
          if ($missing) {
            foreach ($line in ($missing | Select-Object -First 25)) { Write-Host "::error::verify: $line" }
            throw "verify.sql reports $($missing.Count) MISSING object(s)"
          }

      - name: 03-relations.sql must report no VIOLATION
        shell: pwsh
        run: |
          $out = sqlcmd -S "(localdb)\T5Web" -E -i src/T5Web/db/03-relations.sql -d ReportT5V3 -h -1 -W -f 65001 2>&1
          $out | Write-Host
          $bad = $out | Select-String -Pattern 'VIOLATION'
          if ($bad) {
            foreach ($line in ($bad | Select-Object -First 25)) { Write-Host "::error::relations: $line" }
            throw "03-relations.sql reports $($bad.Count) violation(s)"
          }

      - name: Migration fingerprint round trip
        shell: pwsh
        run: |
          function Invoke-Fingerprint([string]$outFile) {
            $text = sqlcmd -S "(localdb)\T5Web" -E -b -i fingerprint.sql -h -1 -W -f 65001 2>&1
            $code = $LASTEXITCODE
            if ($code -ne 0) {
              foreach ($line in ($text | Select-Object -First 20)) { Write-Host "::error::fingerprint sqlcmd: $line" }
              throw "the fingerprint script failed with $code"
            }
            $tables = @($text | Where-Object { $_ -match '^\s*table\|' })
            if ($tables.Count -lt 80) {
              foreach ($line in ($text | Select-Object -First 20)) { Write-Host "::error::fingerprint output: $line" }
              throw "the fingerprint produced $($tables.Count) table lines, expected 80+"
            }
            $text | Set-Content -LiteralPath $outFile -Encoding ascii
            Write-Host "$outFile : $($tables.Count) table lines"
          }

          python src/T5Web/tools/migration-fingerprint.py --sql > fingerprint.sql
          Invoke-Fingerprint 'fingerprint-a.txt'
          Invoke-Fingerprint 'fingerprint-b.txt'
          $out = python src/T5Web/tools/migration-fingerprint.py --compare fingerprint-a.txt fingerprint-b.txt 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in $out) { Write-Host "::error::fingerprint: $line" }
            throw 'the fingerprint comparison failed'
          }

      - name: Portal SQL statements against the real engine
        shell: pwsh
        run: |
          $out = python src/T5Web/tools/sql-smoke.py --server '(localdb)\T5Web' -d ReportT5V3 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            foreach ($line in ($out | Select-String -Pattern 'FAIL|Msg \d+|Invalid' | Select-Object -First 25)) {
              Write-Host "::error::smoke: $line"
            }
            throw 'SQL smoke failed'
          }
