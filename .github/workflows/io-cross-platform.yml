name: IO .NET 10 Windows and Linux
on:
  push:
    branches: [arena/5496cceb-io]
    paths:
      - '**'
      - '!ReCode/docs/**'
      - '!**/*.md'
      - '!ReCode/preview/**'
      - '!ReCode/src/IO.Web/Ui/**'
      # The permission-filtered help catalogue is also consumed by C# tests.
      - 'ReCode/src/IO.Web/Ui/HelpContent.json'
      - '!ReCode/tests/**/*-ui-check.cjs'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ReCode
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
      - name: Build, catalogue checks and portable publish
        run: ./tools/verify-platform.ps1
