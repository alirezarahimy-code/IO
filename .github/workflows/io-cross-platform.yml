# Windows-only automatic acceptance by user request. Historical filename retained.
name: IO .NET 10 Windows
on:
  push:
    branches: [arena/5496cceb-io]
    paths:
      - '**'
      - '!ReCode/docs/**'
      - '!**/*.md'
      - '!ReCode/preview/**'
      - '!ReCode/src/IO.Web/Ui/**'
      # The permission-filtered help catalogue is also consumed by C# tests.
      - 'ReCode/src/IO.Web/Ui/HelpContent.json'
      - '!ReCode/tests/**/*-ui-check.cjs'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  platform:
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ReCode
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
      - name: Provision isolated encrypted synthetic photo volume
        run: ./tools/prepare-biometric-photo-ci.ps1
      - name: Build, catalogue checks and portable publish
        run: ./tools/verify-platform.ps1
      - name: Windows LocalDB authenticated gateway and enrollment integration
        timeout-minutes: 4
        env:
          IO_SQL_DISPOSABLE_TEST: 'yes'
          IO_WINDOWS_LOCALDB: 'yes'
        run: |
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -ne 0) { throw 'LocalDB startup failed' }
          dotnet run --project tests/IO.Infrastructure.SqlTests --configuration Release --no-build -- --gateway-enroll-operational
          if ($LASTEXITCODE -ne 0) { throw 'Windows gateway/enrollment SQL integration failed' }
      - name: Detach synthetic photo volume
        if: always()
        run: ./tools/prepare-biometric-photo-ci.ps1 -Cleanup
