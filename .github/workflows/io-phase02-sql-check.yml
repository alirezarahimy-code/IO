name: Temporary delegation migration scaffold
on:
  push:
    branches: [arena/5496cceb-io]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
      - name: Scaffold migration without database
        working-directory: ReCode
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install dotnet-ef --tool-path "$RUNNER_TEMP/ef" --version 10.0.0
          "$RUNNER_TEMP/ef/dotnet-ef" migrations add DelegationRegistry --project src/IO.Infrastructure --startup-project src/IO.Infrastructure --context IoDbContext --output-dir Migrations
          python3 - <<'PY'
          import base64, glob, pathlib
          for path in sorted(glob.glob('src/IO.Infrastructure/Migrations/*_DelegationRegistry*') + ['src/IO.Infrastructure/Migrations/IoDbContextModelSnapshot.cs']):
              data=base64.b64encode(pathlib.Path(path).read_bytes()).decode()
              print(f'::notice title={path}::{data}')
          PY
