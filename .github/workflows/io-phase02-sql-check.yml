name: Temporary delegation migration scaffold
on:
  push:
    branches: [arena/5496cceb-io]
permissions:
  contents: read
jobs:
  scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: 10.0.x
      - name: Scaffold migration without database
        working-directory: ReCode
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore IO.slnx
          dotnet tool install dotnet-ef --tool-path "$RUNNER_TEMP/ef" --version 10.0.11
          "$RUNNER_TEMP/ef/dotnet-ef" migrations add DelegationRegistry --project src/IO.Infrastructure --startup-project src/IO.Infrastructure --context IoDbContext --output-dir Migrations
          python3 - <<'PY'
          import base64,gzip,io,tarfile
          from pathlib import Path
          root=Path('src/IO.Infrastructure/Migrations')
          files=sorted(root.glob('*_DelegationRegistry*.cs'))+[root/'IoDbContextModelSnapshot.cs']
          assert len(files)==3 and all(f.is_file() for f in files)
          buf=io.BytesIO()
          with tarfile.open(fileobj=buf,mode='w') as archive:
              for f in files: archive.add(f,arcname=f.name)
          encoded=base64.b64encode(gzip.compress(buf.getvalue())).decode('ascii')
          chunks=[encoded[i:i+3000] for i in range(0,len(encoded),3000)]
          print(f'::notice title=DELEGATION_SCAFFOLD_COUNT::{len(chunks)}')
          for i,chunk in enumerate(chunks): print(f'::notice title=DELEGATION_SCAFFOLD_{i:03}::{chunk}')
          PY
