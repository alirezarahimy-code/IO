name: net10-products

# Each product/slice owns its tests. A portable-core check is NOT an IIS/web gate.
on:
  push:
    branches: [arena/a4df3135-io]
    paths:
      - 'src/net10/AriaAdmin/**'
      - 'src/net10/Aria/**'
      - 'src/net10/nuget.offline.config'
      - '.github/workflows/net10-products.yml'
  pull_request:
    paths:
      - 'src/net10/AriaAdmin/**'
      - 'src/net10/Aria/**'
      - '.github/workflows/net10-products.yml'
  workflow_dispatch:

concurrency:
  group: net10-products-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aria-admin-core:
    name: Aria Admin core net10.0 + 9 synthetics + 1 pinned original report-time fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build actual Domain/Application sources offline and run deterministic executable
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dotnet >/dev/null || ! dotnet --list-sdks | grep -Eq '^10\.0\.[0-9]+'; then
            echo '::error::NEEDS-INFRA: no preinstalled .NET 10 SDK; no download fallback.'
            exit 2
          fi
          sdk=$(dotnet --list-sdks | grep '^10\.0\.' | head -n 1)
          echo "::notice::ARIA_ADMIN CORE | local SDK $sdk | net10.0 | no NuGet sources | 25 links + one Admin-only report-time adapter | $RUNNER_OS"
          sources=$(find src/T5Web/T5Web.Domain src/T5Web/T5Web.Application \
            -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' | wc -l)
          if [ "$sources" -ne 25 ]; then
            echo "::error::Core source inventory changed: expected 25, found $sources. Review the linked source manifest."
            exit 1
          fi
          if grep -REl '^using (System\.Web|Personnel\.|T5V3\.)' \
            src/T5Web/T5Web.Domain src/T5Web/T5Web.Application --include='*.cs'; then
            echo '::error::Native/Framework dependency entered the linked portable core.'
            exit 1
          fi
          logdir=$(mktemp -d)
          diagnose() {
            local label="$1"; shift
            local output="$logdir/ariaadmin-core-$label.log"
            set +e
            "$@" >"$output" 2>&1
            local code=$?
            set -e
            cat "$output"
            if [ "$code" -ne 0 ]; then
              { grep -Ei '(^|: )error |NU[0-9]{4}|Exception|\[FAIL\]|Unable to' "$output" || true; } | head -30 |
                while IFS= read -r line; do echo "::error::ARIA_ADMIN CORE $label: $line"; done
              echo "::error::ARIA_ADMIN CORE $label failed ($code); no net10 parity claim."
              exit "$code"
            fi
          }
          project=src/net10/AriaAdmin/Tests/AriaAdmin.Core.Tests.csproj
          diagnose restore dotnet restore "$project" --configfile src/net10/nuget.offline.config -v minimal
          diagnose core-build dotnet build src/net10/AriaAdmin/Core/AriaAdmin.Core.csproj -c Release --no-restore -v minimal
          diagnose tests-build dotnet build "$project" -c Release --no-restore -v minimal
          diagnose synthetics dotnet run --project "$project" -c Release --no-build --no-restore
          if ! grep -q 'Summary: 10 Passed, 0 Failed' "$logdir/ariaadmin-core-synthetics.log"; then
            echo '::error::Aria Admin core executable did not report all 10 checks (9 synthetics + original-format fixture).'
            exit 1
          fi
          echo "::notice::ARIA_ADMIN CORE net10.0 | 25 real linked sources + 1 owned report-time adapter | 9/9 synthetics + 1 original-binary-format fixture | $RUNNER_OS | same-run comparison only in separate Windows golden job; no web/IIS/SQL claim"

  aria-admin-web:
    name: Aria Admin Core Razor net10.0 + 14 HTTP/security synthetics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Offline build, Razor compilation, publish and loopback HTTP security matrix
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dotnet >/dev/null || ! dotnet --list-sdks | grep -Eq '^10\.0\.[0-9]+'; then
            echo '::error::NEEDS-INFRA: .NET 10 SDK/ref packs not preinstalled; no online restore fallback.'
            exit 2
          fi
          sdk=$(dotnet --list-sdks | grep '^10\.0\.' | head -n 1)
          echo "::notice::ARIA_ADMIN CORE WEB | preinstalled $sdk | RazorBuild=true | offline NuGet | $RUNNER_OS"
          if grep -RE 'X-(Synthetic-Identity|Directory-Test-Identity)' src/net10/AriaAdmin/Web/ --include='*.cs'; then
            echo '::error::Test header leaked into publishable production Web code.'
            exit 1
          fi
          if grep -RE 'WWW-Authenticate|IisWindowsIdentitySource|GetWindowsUser' \
              src/net10/AriaAdmin/Web/ --include='*.cs'; then
            echo '::error::An unverified Windows-only login or second credential prompt entered Admin Web.'
            exit 1
          fi
          logdir=$(mktemp -d)
          diagnose() {
            local label="$1"; shift
            local output="$logdir/web-$label.log"
            set +e
            "$@" >"$output" 2>&1
            local code=$?
            set -e
            cat "$output"
            if [ "$code" -ne 0 ]; then
              { grep -Ei '(^|: )error |NU[0-9]{4}|Exception|\[FAIL\]|Unable to' "$output" || true; } | head -35 |
                while IFS= read -r line; do echo "::error::ARIA_ADMIN WEB $label: $line"; done
              echo "::error::ARIA_ADMIN WEB $label failed ($code); no web parity claim."
              exit "$code"
            fi
          }
          web=src/net10/AriaAdmin/Web/AriaAdmin.Web.csproj
          tests=src/net10/AriaAdmin/Web.Tests/AriaAdmin.Web.Tests.csproj
          diagnose restore dotnet restore "$tests" --configfile src/net10/nuget.offline.config -v minimal
          diagnose web-build dotnet build "$web" -c Release --no-restore -v minimal
          diagnose tests-build dotnet build "$tests" -c Release --no-restore -v minimal
          diagnose publish dotnet publish "$web" -c Release --no-restore -o "$logdir/published" -v minimal
          if [ ! -f "$logdir/published/AriaAdmin.Web.dll" ] ||
             [ ! -f "$logdir/published/wwwroot/assets/admin.css" ]; then
            echo '::error::Core publish missing host or offline stylesheet.'
            exit 1
          fi
          diagnose http dotnet run --project "$tests" -c Release --no-build --no-restore -- \
            "$GITHUB_WORKSPACE/src/net10/AriaAdmin/Web"
          if ! grep -q 'Summary: 14 Passed, 0 Failed' "$logdir/web-http.log"; then
            echo '::error::Admin HTTP suite did not complete all 14 checks.'
            exit 1
          fi
          echo "::notice::ARIA_ADMIN WEB net10.0 | Razor compiled/published | 14/14 synthetic loopback HTTP incl 100 test-only-principal denial burst and badge mismatch denial | $RUNNER_OS | NOT 100 operational users, shared-password/IIS/SQL/original parity"

  aria-core:
    name: Aria core net10.0 + 11 synthetics + 3 bounded pure-helper groups (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Build portable TWF rewrite core offline and run synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dotnet >/dev/null || ! dotnet --list-sdks | grep -Eq '^10\.0\.[0-9]+'; then
            echo '::error::NEEDS-INFRA: .NET 10 SDK/ref packs not preinstalled; no download fallback.'
            exit 2
          fi
          sdk=$(dotnet --list-sdks | grep '^10\.0\.' | head -n 1)
          echo "::notice::ARIA CORE | preinstalled $sdk | 19 linked sources + 4 owned files (labels, original time, original Persian date, catalog boundary) | offline NuGet | $RUNNER_OS"
          sources=$(find src/TWF/TWF.Domain -name '*.cs' -not -path '*/obj/*' -not -path '*/bin/*' | wc -l)
          if [ "$sources" -ne 15 ]; then
            echo "::error::Aria Domain source inventory changed: expected 15, found $sources. Review linked manifest."
            exit 1
          fi
          for file in \
            src/TWF/TWF.Application/Leaves/LeaveBalanceService.cs \
            src/TWF/TWF.Application/Organization/T5OrganizationAccessService.cs \
            src/TWF/TWF.Application/Security/SessionManager.cs \
            src/TWF/TWF.Infrastructure/Licensing/UnrestrictedLicenseService.cs; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing pinned Aria portable source: $file"
              exit 1
            fi
            if grep -En '^using (System\.Web|T5V3\.|Personnel\.|TD5\.)|\[DllImport\(' "$file"; then
              echo "::error::Framework/native source entered Aria Core manifest: $file"
              exit 1
            fi
          done
          if grep -REn '^using (System\.Web|T5V3\.|Personnel\.|TD5\.)|\[DllImport\(' \
              src/TWF/TWF.Domain --include='*.cs'; then
            echo '::error::Framework/native source entered Aria Domain.'
            exit 1
          fi
          if grep -E '<(PackageReference|Reference[[:space:]>])' \
              src/net10/Aria/Core/Aria.Core.csproj; then
            echo '::error::New Aria Core cannot load the original x86 engine or remote packages.'
            exit 1
          fi
          logdir=$(mktemp -d)
          diagnose() {
            local label="$1"; shift
            local output="$logdir/aria-core-$label.log"
            set +e
            "$@" >"$output" 2>&1
            local code=$?
            set -e
            cat "$output"
            if [ "$code" -ne 0 ]; then
              { grep -Ei '(^|: )error |NU[0-9]{4}|Exception|\[FAIL\]|Unable to' "$output" || true; } | head -35 |
                while IFS= read -r line; do echo "::error::ARIA CORE $label: $line"; done
              echo "::error::ARIA CORE $label failed ($code); no original/web parity claim."
              exit "$code"
            fi
          }
          tests=src/net10/Aria/Tests/Aria.Core.Tests.csproj
          core=src/net10/Aria/Core/Aria.Core.csproj
          diagnose restore dotnet restore "$tests" --configfile src/net10/nuget.offline.config -v minimal
          diagnose core-build dotnet build "$core" -c Release --no-restore -v minimal
          diagnose tests-build dotnet build "$tests" -c Release --no-restore -v minimal
          diagnose synthetics dotnet run --project "$tests" -c Release --no-build --no-restore
          if ! grep -q 'Summary: 14 Passed, 0 Failed' "$logdir/aria-core-synthetics.log"; then
            echo '::error::Aria Core test suite did not report all 14 cases (11 synthetic + two time groups + one date/day smoke).'
            exit 1
          fi
          echo "::notice::ARIA CORE net10.0 | 19 linked TWF sources + 4 owned files | 11/11 synthetics + 2 pinned pure-time groups + 1 rewrite-derived date/day smoke group | $RUNNER_OS | binary-to-port time/date/day same-run check only in separate Windows original-golden workflow; NOT native engine/SQL/web parity"

  aria-web:
    name: Aria Core Razor net10.0 + 22 HTTP/security and public About route checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Offline build and publish Aria MVC/Razor with fail-closed Kestrel HTTP checks
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v dotnet >/dev/null || ! dotnet --list-sdks | grep -Eq '^10\.0\.[0-9]+'; then
            echo '::error::NEEDS-INFRA: .NET 10 SDK/ref packs not preinstalled; no online restore fallback.'
            exit 2
          fi
          sdk=$(dotnet --list-sdks | grep '^10\.0\.' | head -n 1)
          echo "::notice::ARIA CORE WEB | preinstalled $sdk | RazorBuild=true | offline NuGet | $RUNNER_OS"
          if grep -RE 'X-(Synthetic-Session|Aria-Profile-Test)|test-only/session|SyntheticIdentityProbeController' \
              src/net10/Aria/Web/ --include='*.cs'; then
            echo '::error::Synthetic authentication or inspection route entered publishable Aria Web code.'
            exit 1
          fi
          if ! grep -Fq 'AddSingleton<IAriaSessionVerifier, UnavailableLegacySessionVerifier>()' src/net10/Aria/Web/Program.cs ||
             ! grep -Fq 'AddSingleton<IAriaPersonnelDirectory, UnavailablePersonnelDirectory>()' src/net10/Aria/Web/Program.cs; then
            echo '::error::Aria production must keep both credential and Personnel eligibility gates fail-closed.'
            exit 1
          fi
          if [ "$(find src/net10/Aria/Web/wwwroot -type f | wc -l)" -ne 3 ] ||
             [ ! -f src/net10/Aria/Web/wwwroot/assets/aria-about-arm.png ] ||
             [ ! -f src/net10/Aria/Web/wwwroot/assets/aria-about-logo.png ] ||
             ! cmp -s src/TWF/TWF.Web/Content/twf-industrial-ui.css \
                      src/net10/Aria/Web/wwwroot/assets/aria.css; then
            echo '::error::Expected only audited local Aria CSS and the two pinned original vendor About images.'
            exit 1
          fi
          if grep -Ei 'https?://|@import|url\(' src/net10/Aria/Web/wwwroot/assets/aria.css; then
            echo '::error::Aria stylesheet must not fetch online UI assets.'
            exit 1
          fi
          logdir=$(mktemp -d)
          diagnose() {
            local label="$1"; shift
            local output="$logdir/aria-web-$label.log"
            set +e
            "$@" >"$output" 2>&1
            local code=$?
            set -e
            cat "$output"
            if [ "$code" -ne 0 ]; then
              { grep -Ei '(^|: )error |NU[0-9]{4}|Exception|\[FAIL\]|Unable to' "$output" || true; } | head -35 |
                while IFS= read -r line; do echo "::error::ARIA WEB $label: $line"; done
              echo "::error::ARIA WEB $label failed ($code); no original/IIS parity claim."
              exit "$code"
            fi
          }
          web=src/net10/Aria/Web/Aria.Web.csproj
          tests=src/net10/Aria/Web.Tests/Aria.Web.Tests.csproj
          diagnose restore dotnet restore "$tests" --configfile src/net10/nuget.offline.config -v minimal
          diagnose web-build dotnet build "$web" -c Release --no-restore -v minimal
          diagnose tests-build dotnet build "$tests" -c Release --no-restore -v minimal
          diagnose publish dotnet publish "$web" -c Release --no-restore -o "$logdir/published" -v minimal
          if [ ! -f "$logdir/published/Aria.Web.dll" ] ||
             [ ! -f "$logdir/published/wwwroot/assets/aria.css" ] ||
             [ ! -f "$logdir/published/wwwroot/assets/aria-about-arm.png" ] ||
             [ ! -f "$logdir/published/wwwroot/assets/aria-about-logo.png" ]; then
            echo '::error::Aria publish missing host or pinned offline About assets.'
            exit 1
          fi
          diagnose http dotnet run --project "$tests" -c Release --no-build --no-restore -- \
            "$GITHUB_WORKSPACE/src/net10/Aria/Web"
          if ! grep -q 'Summary: 22 Passed, 0 Failed' "$logdir/aria-web-http.log"; then
            echo '::error::Aria HTTP suite did not complete all 22 tests.'
            exit 1
          fi
          echo "::notice::ARIA WEB net10.0 | Razor compiled/published | 22/22 Kestrel checks incl public About GET, pinned images and bounded original MyBanner(2/3) URLs | $RUNNER_OS | original text/pixel SAME-RUN golden is separate Windows job; no original full HTML/password/SQL/engine/IIS parity"

  aria-catalog-boundary:
