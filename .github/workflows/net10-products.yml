            set +e
            "$@" >"$output" 2>&1
            local code=$?
            set -e
            cat "$output"
            if [ "$code" -ne 0 ]; then
              { grep -Ei '(^|: )error |NU[0-9]{4}|Exception|\[FAIL\]|Unable to' "$output" || true; } | head -35 |
                while IFS= read -r line; do echo "::error::ARIA CATALOG $label: $line"; done
              echo "::error::ARIA CATALOG $label failed ($code); no SQL Server/schema/auth parity claim."
              exit "$code"
            fi
          }
          tests=src/net10/Aria/Catalog.Tests/Aria.Catalog.Tests.csproj
          core=src/net10/Aria/Core/Aria.Core.csproj
          diagnose restore dotnet restore "$tests" --configfile src/net10/nuget.offline.config -v minimal
          diagnose core-build dotnet build "$core" -c Release --no-restore -v minimal
          diagnose tests-build dotnet build "$tests" -c Release --no-restore -v minimal
          diagnose synthetics dotnet run --project "$tests" -c Release --no-build --no-restore
          if ! grep -q 'Summary: 7 Passed, 0 Failed' "$logdir/aria-catalog-synthetics.log"; then
            echo '::error::Aria catalog suite did not complete all seven synthetic cases.'
            exit 1
          fi
          echo "::notice::ARIA catalog net10.0 | two fake ADO.NET catalogs | 7/7 synthetic cases incl 100 overlapping probes | $RUNNER_OS | NO SQL provider/connection/schema/real load or original parity"

  aria-admin-directory-boundary:
    name: Aria Admin two-catalog directory net10.0 + 8 ADO.NET + 2 HTTP synthetics (${{ matrix.os }})
