name: net10-original-aria-session

# Separate read-only original-product golden. Cookie, logout, route and attribute
# checks run in Framework memory only. No IIS, SQL, customer accounts, authentication
# service, install, restart, or mutation of an existing product.
on:
  push:
    branches: [arena/a4df3135-io]
    paths:
      - 'src/net10/tools/AriaOriginalSessionGolden/**'
      - 'TWF 4.28/App/bin/MyTime3.dll'
      - '.github/workflows/net10-original-aria-session.yml'
  pull_request:
    paths:
      - 'src/net10/tools/AriaOriginalSessionGolden/**'
      - 'TWF 4.28/App/bin/MyTime3.dll'
      - '.github/workflows/net10-original-aria-session.yml'
  workflow_dispatch:

jobs:
  original-aria-session:
    name: Pinned TWF 4.28 cookie/route observations (Windows Framework, in-memory only)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run original binary with synthetic in-memory cookie, no secrets/SQL/IIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = Join-Path $env:GITHUB_WORKSPACE 'TWF 4.28\App\bin\MyTime3.dll'
          $expected = 'edba04ccafb9f111870f9050f86e9059e92389188bbd3115678afb21691ddd6b'
          if (-not (Test-Path -LiteralPath $original -PathType Leaf)) {
            Write-Host '::error::NEEDS-INFRA: original TWF 4.28 MyTime3.dll unavailable.'
            exit 2
          }
          $actual = (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            Write-Host "::error::Original TWF 4.28 binary SHA drift: $actual; refuse cookie golden."
            exit 1
          }
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            Write-Host '::error::NEEDS-INFRA: preinstalled .NET Framework compiler unavailable.'
            exit 2
          }
          $probe = Join-Path $env:RUNNER_TEMP 'AriaOriginalSessionProbe.exe'
          $source = Join-Path $env:GITHUB_WORKSPACE 'src\net10\tools\AriaOriginalSessionGolden\Program.cs'
          $build = & $compiler '/nologo' '/target:exe' '/r:System.Web.dll' ("/out:" + $probe) $source 2>&1
          $buildCode = $LASTEXITCODE
          $build | Write-Host
          if ($buildCode -ne 0 -or -not (Test-Path -LiteralPath $probe -PathType Leaf)) {
            foreach ($line in @($build | Select-Object -First 25)) { Write-Host "::error::Aria original-session probe build: $line" }
            exit 1
          }
          $output = & $probe $original 2>&1
          $code = $LASTEXITCODE
          $output | Write-Host
          if ($code -ne 0 -or -not ($output | Select-String -Quiet 'Summary: 16 Passed, 0 Failed')) {
            # GitHub surfaces only a bounded number of check annotations. Emit
            # failures before PASS lines; never annotate synthetic cookie bytes.
            Write-Host '::error::No original logout golden can be accepted from this run.'
            foreach ($line in @($output | Where-Object { $_ -notmatch '\[ORIGINAL-PASS\]' } | Select-Object -Last 6)) {
              Write-Host "::error::Aria original-session probe failure: $line"
            }
            exit 1
          }
          Write-Host '::notice::TWF 4.28 original-binary 16/16 in-memory cookie/logout/replay/route/attribute cases. After response cookie expiry, the same synthetic value manually resubmitted to a fresh original filter still passes; NOT browser behavior or an original HTTP/action/DB golden. The new host rejects all old DES cookies and MUST NOT enable login/logout until same-account verification plus revocable fresh sessions are proven. NOT SQL/IIS parity or deployment.'
