name: net10-original-aria-password-contract

# Offline, read-only inspection of actual original x86 IL method calls.
# NO passwords, stored hashes, keys, SQL, login or full credential parity.
on:
  push:
    branches: [arena/a4df3135-io]
    paths:
      - 'src/net10/tools/AriaOriginalPasswordContract/**'
      - '.github/workflows/net10-original-aria-password-contract.yml'
  pull_request:
    paths:
      - 'src/net10/tools/AriaOriginalPasswordContract/**'
      - '.github/workflows/net10-original-aria-password-contract.yml'
  workflow_dispatch:

jobs:
  personnel-checkuserpass-metadata:
    name: Personnel.dll x86 CheckUserPass call graph (NO runtime credentials)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile x86 metadata inspector from source with preinstalled Framework compiler
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = Join-Path $env:GITHUB_WORKSPACE 'TWF 4.28\App\bin\Personnel.dll'
          $expected = '468e43ea66b9c591384ddcd033918e6f563a85b4caa2b6e6c4e8b85a4484050f'
          if (-not (Test-Path -LiteralPath $original -PathType Leaf) -or
              (Get-FileHash -LiteralPath $original -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            Write-Host '::error::NEEDS-INFRA: TWF 4.28 original Personnel.dll SHA unavailable or changed.'
            exit 2
          }
          # Original Personnel.dll CLR flags=0x3 (ILONLY | 32BITREQUIRED);
          # ONLY this disposable original binary metadata reader runs x86.
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework\v4.0.30319\csc.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            Write-Host '::error::NEEDS-INFRA: installed .NET Framework x86 compiler unavailable.'
            exit 2
          }
          $exe = Join-Path $env:RUNNER_TEMP 'AriaOriginalPasswordMetadata.exe'
          $src = Join-Path $env:GITHUB_WORKSPACE 'src\net10\tools\AriaOriginalPasswordContract\Program.cs'
          $compile = & $compiler '/nologo' '/platform:x86' '/target:exe' '/r:System.Core.dll' ("/out:" + $exe) $src 2>&1
          $compile | Write-Host
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            Write-Host '::error::Original metadata inspector failed to compile.'
            exit 1
          }
          $output = & $exe $original 2>&1
          $code = $LASTEXITCODE
          $output | Write-Host
          if ($code -ne 0 -or -not ($output | Select-String -Quiet 'Summary: original Personnel.CheckUserPass call metadata inspected')) {
            # gh run log downloads can be unavailable in a restricted sandbox;
            # annotate only exception/metadata names, never IL strings/values.
            foreach ($line in @($output | Select-Object -First 12)) {
              Write-Host "::error::ARIA ORIGINAL META FAILED | $line"
            }
            Write-Host '::error::Original credential call metadata could not be inspected; NO password algorithm inferred.'
            exit 1
          }
          foreach ($line in @($output | Where-Object { $_ -match '^(OVERLOAD|METHOD|  CALL)' } | Select-Object -First 40)) {
            Write-Host "::notice::ARIA ORIGINAL META | $line"
          }
          Write-Host '::notice::ARIA PERSONNEL | x86 pinned original call graph only; password storage, validity, SQL 2016, new net10 verifier and release still UNPROVEN.'
