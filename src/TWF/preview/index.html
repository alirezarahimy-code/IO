<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ورود به سامانه آریا — پیش‌نمایش بازنویسی</title>
    <link href="../TWF.Web/Content/twf-industrial-ui.css" rel="stylesheet" />
    <link href="preview.css" rel="stylesheet" />
</head>
<body class="twf-auth-page">

    <div class="twf-auth-card">
        <div class="twf-auth-header">
            <div class="twf-auth-brand">
                <span class="twf-brand-mark">آ</span>
                <div>
                    <h1>سامانه حضور و غیاب و کارتابل آریا</h1>
                    <p>سامانه جامع حضور و غیاب، کارتابل سازمانی و گردش کار</p>
                </div>
            </div>
            <p style="margin-top:14px;">ورود به برنامه</p>
        </div>

        <div class="twf-auth-body">
            <div class="twf-alert twf-alert-info" style="font-size:12.5px;">
                این صفحه، پیش‌نمایش آفلاین رابط کاربری بازنویسی‌شده است. برای مشاهده داشبورد عملیاتی وارد شوید.
            </div>

            <form id="loginForm" onsubmit="return goToApp(event);">
                <div class="twf-form-group">
                    <label for="UserName">نام کاربری</label>
                    <input type="text" id="UserName" name="UserName" class="twf-input" value="admin" autocomplete="username" required />
                </div>

                <div class="twf-form-group">
                    <label for="Password">کلمه عبور</label>
                    <input type="password" id="Password" name="Password" class="twf-input" value="aria@1404" autocomplete="current-password" required />
                </div>

                <div class="twf-form-group" style="display:flex; align-items:center; gap:8px;">
                    <input type="checkbox" id="remember" checked />
                    <label for="remember" style="margin:0; font-weight:500;">مرا به خاطر بسپار (کوکی امن HttpOnly)</label>
                </div>

                <div style="margin-top: 20px;">
                    <button type="submit" class="twf-btn twf-btn-primary" style="width: 100%; height: 42px; font-size: 14px;">
                        ورود به سامانه
                    </button>
                </div>
            </form>
        </div>

        <div class="twf-auth-footer">
            <span>Zero-Lock · 100% Offline · Layered Architecture</span>
            <span class="twf-num">Aria v5.0</span>
        </div>
    </div>

    <script>
        function goToApp(e) {
            e.preventDefault();
            window.location.href = 'app.html';
            return false;
        }
    </script>
</body>
</html>
