<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به سامانه</title><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/theme.css"><link rel="stylesheet" href="/assets/employees.css"><script src="/assets/login.js" defer></script></head><body><main><header class="page-heading"><div><p class="eyebrow">سامانهٔ حضور · آزمایشی</p><h1>ورود به حساب</h1><p>با حساب تخصیص‌یافته وارد شوید؛ نام کاربری و گذرواژهٔ خود را در اختیار دیگران قرار ندهید.</p></div></header><div id="notice" role="status" aria-live="polite"></div><section><form id="login-form"><label>نام کاربری <input name="userName" autocomplete="username" maxlength="200" required></label><label>گذرواژه <input name="password" type="password" autocomplete="current-password" maxlength="256" required></label><button type="submit">ورود</button></form></section><p class="footnote">احراز هویت و کنترل دسترسی سمت سرور انجام می‌شود. در صورت لزوم ابتدا گذرواژهٔ موقت را تغییر دهید.</p></main></body></html>
